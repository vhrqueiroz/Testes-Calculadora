<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG — Cadastro de Registros</title>
  <style>
    :root{--bg:#141414;--panel:#232323;--panel2:#1b1b1b;--line:#3b3b3b;--text:#f1f1f1;--muted:#aaa;--accent:#586bea;--danger:#d95f59;--ok:#32b67a}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial, sans-serif}
    .container{max-width:1050px;margin:auto;padding:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
    h1,h2{margin:0 0 8px} p{margin:8px 0;color:var(--muted)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .login{max-width:470px;margin:8vh auto}.field{margin-top:12px} label{display:block;color:var(--muted);font-weight:700;margin-bottom:5px}
    input,select{width:100%;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text)}
    button{height:40px;border:0;border-radius:8px;padding:0 15px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:transparent;border:1px solid var(--line)}button.danger{background:var(--danger)}
    .actions{display:flex;gap:8px;align-items:center;margin-top:16px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.status{min-height:20px;margin-top:12px}.ok{color:var(--ok)}.error{color:#ff8b84}
    .table-wrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--muted)}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.container{padding:14px}.topbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="container">
    <section id="loginScreen" class="card login">
      <h1>Calculadora de Hit Rate</h1>
      <p>Entre para gerenciar os registros.</p>
      <form id="loginForm">
        <div class="field"><label for="loginUsuario">Usuário</label><input id="loginUsuario" autocomplete="username" required></div>
        <div class="field"><label for="loginSenha">Senha</label><input id="loginSenha" type="password" autocomplete="current-password" required></div>
        <div class="actions"><button type="submit">Entrar</button></div>
      </form>
      <div id="loginStatus" class="status" aria-live="polite"></div>
    </section>

    <section id="appScreen" class="hidden">
      <div class="topbar">
        <div><h1>Cadastro de registros</h1><p>Usuário conectado: <strong id="userBadge"></strong></p></div>
        <button id="logoutButton" class="secondary" type="button">Sair</button>
      </div>
      <section class="card">
        <h2>Novo registro</h2><p>O usuário conectado será gravado automaticamente na coluna “Usuário”.</p>
        <form id="recordForm">
          <div class="grid">
            <div class="field"><label for="sheetName">Aba da coleção</label><select id="sheetName" required><option value="ME04 - Caos Ascendente">ME04 - Caos Ascendente</option><option value="ME05 - Escuridão Absoluta">ME05 - Escuridão Absoluta</option><option value="Celebração 30 anos">Celebração 30 anos</option></select></div>
            <div class="field"><label for="bloco">Bloco</label><input id="bloco" value="Mega Evolução"></div>
            <div class="field"><label for="colecao">Coleção</label><input id="colecao" required></div>
            <div class="field"><label for="produto">Produto</label><input id="produto" required placeholder="Ex.: Booster Box"></div>
            <div class="field"><label for="nacionalidade">Nacionalidade</label><select id="nacionalidade"><option>Brasil</option><option>USA</option></select></div>
            <div class="field"><label for="boosters">Total de Boosters</label><input id="boosters" type="number" min="0" value="0" required></div>
            <div class="field"><label for="totalCartas">Total de Cartas</label><input id="totalCartas" type="number" min="0" value="0"></div>
            <div class="field"><label for="totalHits">Total de Hit</label><input id="totalHits" type="number" min="0" value="0" required></div>
          </div>
          <div class="actions"><button type="submit">Salvar registro</button><button id="reloadButton" type="button" class="secondary">Atualizar lista</button></div>
        </form>
        <div id="recordStatus" class="status" aria-live="polite"></div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>Produto</th><th>Nacionalidade</th><th>Boosters</th><th>Total</th><th>Usuário</th><th>Ação</th></tr></thead><tbody id="recordsBody"></tbody></table></div>
      </section>
    </section>
  </main>
  <script src="gasApi.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let currentSheet = '';
    const setStatus = (id, message, type='') => { const el=$(id); el.textContent=message; el.className='status '+type; };
    const value = id => $(id).value.trim();

    function showApp(){ $('loginScreen').classList.add('hidden'); $('appScreen').classList.remove('hidden'); $('userBadge').textContent=getLoggedUser(); loadRecords(); }
    function showLogin(){ $('appScreen').classList.add('hidden'); $('loginScreen').classList.remove('hidden'); }

    async function loadRecords(){
      currentSheet=value('sheetName');
      setStatus('recordStatus','Carregando...');
      const records=await getRecords(currentSheet);
      const body=$('recordsBody'); body.innerHTML='';
      records.forEach(record=>{
        const tr=document.createElement('tr');
        const cells=[record.ID,record.Produto,record.Nacionalidade,record['Total de Boosters'] ?? record.Boosters,record.Total ?? record['Total de Hit'],record['Usuário'] ?? record.Usuario];
        cells.forEach(item=>{const td=document.createElement('td');td.textContent=item ?? '';tr.appendChild(td);});
        const td=document.createElement('td'); const btn=document.createElement('button');btn.textContent='Excluir';btn.className='danger';btn.type='button';btn.onclick=async()=>{if(!confirm('Excluir este registro?'))return;const ok=await deleteRecord(currentSheet,record.ID);if(ok)loadRecords();};td.appendChild(btn);tr.appendChild(td);body.appendChild(tr);
      });
      setStatus('recordStatus',`${records.length} registro(s) carregado(s).`,'ok');
    }

    $('loginForm').addEventListener('submit',async event=>{event.preventDefault();setStatus('loginStatus','Validando...');const result=await loginApp(value('loginUsuario'),$('loginSenha').value);if(result.success){$('loginForm').reset();showApp();}else setStatus('loginStatus',result.error||'Usuário ou senha inválidos.','error');});
    $('logoutButton').addEventListener('click',()=>{logoutApp();showLogin();setStatus('loginStatus','Sessão encerrada.');});
    $('sheetName').addEventListener('change',loadRecords); $('reloadButton').addEventListener('click',loadRecords);
    $('recordForm').addEventListener('submit',async event=>{event.preventDefault();const data={'Bloco':value('bloco'),'Coleção':value('colecao'),'Produto':value('produto'),'Nacionalidade':value('nacionalidade'),'Total de Boosters':Number(value('boosters')||0),'Total de Cartas':Number(value('totalCartas')||0),'Total de Hit':Number(value('totalHits')||0),'Total':Number(value('totalHits')||0)};setStatus('recordStatus','Salvando...');const id=await addRecord(value('sheetName'),data);if(id!==null){setStatus('recordStatus','Registro salvo com sucesso.','ok');$('recordForm').reset();$('bloco').value='Mega Evolução';$('boosters').value=0;$('totalCartas').value=0;$('totalHits').value=0;loadRecords();}else setStatus('recordStatus','Não foi possível salvar o registro.','error');});
    if(getLoggedUser()) showApp();
  </script>
</body>
</html>
